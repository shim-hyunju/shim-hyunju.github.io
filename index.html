<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 이전 안내 / Site Relocation Notice</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f0e8;
            color: #1a1410;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #b08d57;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .timer {
            font-weight: bold;
            color: #d9534f;
        }
        .btn-move {
            display: inline-block;
            background-color: #1a1410;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .btn-move:hover {
            background-color: #333;
        }
    </style>
    <script>
        let seconds = 5;
        const targetUrl = "https://shimgoon.pythonanywhere.com";

        function countdown() {
            if (seconds <= 0) {
                window.location.href = targetUrl;
                return;
            }
            document.getElementById('seconds').textContent = seconds;
            seconds--;
            setTimeout(countdown, 1000);
        }

        window.onload = countdown;
    </script>
</head>
<body>
    <div class="container">
        <h1>사이트 이전 안내</h1>
        <p>
            '친절한 한국어 분석 사전' 사이트가 더 나은 서비스를 위해 새로운 주소로 이전되었습니다.<br>
            https://shimgoon.pythonanywhere.com<br><br>
            <span class="timer"><span id="seconds">5</span>초 후에 자동으로 이동합니다.</span>
        </p>
        <p style="font-size: 14px; color: #666;">
            The site has moved to a new address for better service.<br>
            You will be redirected in <span id="seconds-en">5</span> seconds.
        </p>
        <a href="https://shimgoon.pythonanywhere.com" class="btn-move">지금 이동하기 / Move Now</a>
    </div>
    <script>
        // Update both timer displays
        setInterval(() => {
            const sec = document.getElementById('seconds').textContent;
            document.getElementById('seconds-en').textContent = sec;
        }, 100);
    </script>
</body>
</html>
